bot_url: "http://localhost:8081"
port: "8080"

access_type: "SQL" # SQL | ORM
postgres:
  user: "postgres"
  db: "linktracker"
  host: "localhost"
  port: "5432"
  ssl_mode: "disable"

logging:
  mode: "INFO" #variants ["INFO", "DEBUG"]

batch:
  size: 250 #50 - 500

scheduler:
  interval: "1m"
  workers: 4

kafka:
  enabled: true                              # true => при недоступности HTTP-бота уведомления уходят в Kafka (fallback)
  brokers:                                   # bootstrap.servers; перечисляем все 3 для отказоустойчивости, клиент сам выберет рабочий
    - "localhost:19092"
    - "localhost:29092"
    - "localhost:39092"
  links_topic: "link-updates"                # топик основного потока уведомлений; имя совпадает с тем, что слушает бот
  failed_links_topic: "failed-links"         # топик для уведомлений о неуспешных проверках ссылок
  dlq_topic: "link-updates-dlq"              # имя DLQ топика; на стороне scrapper не используется напрямую, нужен только боту
  schema_registry_url: "http://localhost:18081"
  update_subject: "link-update-event-value"
  failed_subject: "failed-links-event-value"

  producer:
    mode: "outbox"                           # direct => писать прямо в Kafka из notifier; outbox => писать в outbox-таблицу + публишер
    producer_client: "scrapper-producer"     # client.id; помечает наши соединения в Kafka UI и логах брокера
    write_timeout: "5s"                      # таймаут на одну попытку отправки батча; больше => дольше ждём при падении сети
    required_ack: -1                         # acks=all: запись подтверждается только после фиксации в min.insync.replicas (=2 в кластере)
    max_attempts: 5                          # сколько раз kafka-go повторит отправку до возврата ошибки наружу (защищает от ребалансов)

    outbox:                                  # настройки публишера Transactional Outbox (используются только при mode=outbox)
      poll_interval: "200ms"                 # как часто публишер опрашивает таблицу outbox; меньше => ниже latency, выше нагрузка на БД
      batch_size: 50                         # сколько pending-строк забирать за один тик; компромисс между throughput и блокировкой
      lock_for: "30s"                        # на сколько прячем уже взятую строку через available_at; если паблишер упадёт — её через это время перезаберёт другой
      max_attempts: 5                        # после стольких неудачных попыток отправки строка получает status='failed' и больше не ретраится
      base_backoff: "500ms"                  # начальная задержка экспоненциального бэкоффа между ретраями одной строки
      max_backoff: "1m"                      # верхняя граница бэкоффа; чтобы 5-я попытка не ушла на сутки

resilience:
  http:
    timeout: "5s"
  retry:
    max_attempts: 3
    delay: "200ms"
    backoff: "constant"   # constant | exponential
    max_delay: "0s"       # верхняя граница для exponential (0 = без ограничения)
    retryable_statuses: [500, 502, 503, 504]
  circuit_breaker:
    sliding_window_size: 10
    minimum_required_calls: 5
    failure_rate_threshold: 100
    permitted_calls_in_half_open_state: 5
    wait_duration_in_open_state: "1s"
  rate_limit:
    rps: 20
    burst: 40

valkey:
  enabled: true
  addrs:
    - "localhost:17000"
    - "localhost:17001"
    - "localhost:17002"
  key_prefix: "scrapper:links:"
  ttl: "5m"
  client_cache:
    enabled: false
    ttl: "1m"