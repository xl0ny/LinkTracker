bot_url: "http://localhost:18082"
port: "8080"

metrics:
  refresh_interval: "30s"
  pushgateway:
    enabled: false
    url: "http://localhost:9091"
    job: "scrapper"
    interval: "15s"

access_type: "SQL" # SQL | ORM
postgres:
  user: "postgres"
  db: "linktracker"
  host: "localhost"
  port: "5432"
  ssl_mode: "disable"

logging:
  mode: "INFO" #variants ["INFO", "DEBUG"]

batch:
  size: 250 #50 - 500

scheduler:
  interval: "5m"
  workers: 4

kafka:
  enabled: true
  brokers:
    - "localhost:19092"
    - "localhost:29092"
    - "localhost:39092"
  raw_updates_topic: "link.raw-updates"          # scrapper -> AI Agent
  failed_links_topic: "failed-links"
  dlq_topic: "link.raw-updates-dlq"              # на стороне scrapper не используется
  schema_registry_url: "http://localhost:18081"
  raw_update_subject: "link-raw-update-event-value"
  failed_subject: "failed-links-event-value"

  producer:
    mode: "outbox"                               # direct => писать прямо в Kafka из notifier; outbox => writer-таблица + публишер
    producer_client: "scrapper-producer"
    write_timeout: "5s"
    required_ack: -1
    max_attempts: 5

    outbox:
      poll_interval: "200ms"
      batch_size: 50
      lock_for: "30s"
      max_attempts: 5
      base_backoff: "500ms"
      max_backoff: "1m"

resilience:
  http:
    timeout: "15s"
  retry:
    max_attempts: 3
    delay: "200ms"
    backoff: "constant"
    max_delay: "0s"
    retryable_statuses: [500, 502, 503, 504]
  circuit_breaker:
    sliding_window_size: 10
    minimum_required_calls: 5
    failure_rate_threshold: 50
    permitted_calls_in_half_open_state: 5
    wait_duration_in_open_state: "30s"
  rate_limit:
    rps: 20
    burst: 40

valkey:
  enabled: true
  addrs:
    - "localhost:17000"
    - "localhost:17001"
    - "localhost:17002"
  key_prefix: "scrapper:links:"
  ttl: "5m"
  client_cache:
    enabled: false
    ttl: "1m"
