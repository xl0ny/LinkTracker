scrapper_url: "http://localhost:8080"
bot_port: "8081"
metrics_port: "8011"

metrics:
  pushgateway:
    enabled: false
    url: "http://localhost:9091"
    job: "bot"
    interval: "15s"

logging:
  mode: "INFO" # variants ["INFO", "DEBUG"]

kafka:
  enabled: true                                  # true => бот читает уведомления из Kafka, иначе из HTTP /updates
  brokers:                                       # три bootstrap-адреса локального KRaft-кластера (см. compose.yaml)
    - "localhost:19092"
    - "localhost:29092"
    - "localhost:39092"
  processed_updates_topic: "link.processed-updates" # топик с обработанными обновлениями от AI Agent
  failed_links_topic: "failed-links"             # отдельный топик для нотификаций о неудачных проверках ссылок
  dlq_topic: "link.processed-updates-dlq"        # сюда бот складывает poison pills и сообщения после исчерпания ретраев
  schema_registry_url: "http://localhost:18081"  # Confluent Schema Registry из compose
  processed_update_subject: "link-processed-update-event-value"
  failed_subject: "failed-links-event-value"

  consumer:
    consumer_group: "bot-link-updates"
    consumer_client_id: "bot-consumer"
    read_timeout: "1s"
    commit_interval: "0s"
    start_offset: "earliest"
    process_retries: 3
    retry_delay: "500ms"

resilience:
  http:
    timeout: "5s"
  retry:
    max_attempts: 3
    delay: "200ms"
    backoff: "constant"
    max_delay: "0s"
    retryable_statuses: [500, 502, 503, 504]
  circuit_breaker:
    sliding_window_size: 10
    minimum_required_calls: 5
    failure_rate_threshold: 100
    permitted_calls_in_half_open_state: 5
    wait_duration_in_open_state: "1s"
  rate_limit:
    rps: 0
    burst: 0

redis:
  enabled: true
  addr: "localhost:6379"
  db: 0
  key_prefix: "bot:processed:"
  ttl: "24h"
