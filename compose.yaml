x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.6.1
  restart: unless-stopped
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1",
      ]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s

x-kafka-env: &kafka-env
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
  CLUSTER_ID: "linktracker-kraft-cluster-1"
  KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_MIN_INSYNC_REPLICAS: "2"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_LOG_RETENTION_HOURS: "168"

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-linktracker}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-linktracker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    image: migrate/migrate:v4.19.1
    profiles: [migrate]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-linktracker}?sslmode=disable"
      - "up"

  kafka-1:
    <<: *kafka-common
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "19092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:19092,INTERNAL://kafka-1:9094"
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-common
    container_name: kafka-2
    hostname: kafka-2
    ports:
      - "29092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "2"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:29092,INTERNAL://kafka-2:9094"
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-common
    container_name: kafka-3
    hostname: kafka-3
    ports:
      - "39092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:39092,INTERNAL://kafka-3:9094"
    volumes:
      - kafka3-data:/var/lib/kafka/data

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: [ "bash", "-c" ]
    command:
      - |
        set -euo pipefail
        BOOTSTRAP="kafka-1:9094,kafka-2:9094,kafka-3:9094"

        create_topic () {
          local name=$$1
          local partitions=$$2
          local rf=$$3
          shift 3
          kafka-topics --bootstrap-server "$$BOOTSTRAP" \
            --create --if-not-exists \
            --topic "$$name" \
            --partitions "$$partitions" \
            --replication-factor "$$rf" \
            "$$@"
        }

        create_topic link-updates       3 3 \
          --config min.insync.replicas=2 \
          --config retention.ms=604800000

        create_topic failed-links       3 3 \
          --config min.insync.replicas=2 \
          --config retention.ms=604800000

        create_topic link-updates-dlq   1 3 \
          --config min.insync.replicas=2 \
          --config retention.ms=2592000000

        kafka-topics --bootstrap-server "$$BOOTSTRAP" --list

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "linktracker-local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka-1:9094,kafka-2:9094,kafka-3:9094"
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  pgdata:
  kafka1-data:
  kafka2-data:
  kafka3-data:
