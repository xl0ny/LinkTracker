x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.6.1
  restart: unless-stopped
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1",
      ]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s

x-kafka-env: &kafka-env
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-broker-1:9093,2@kafka-broker-2:9093,3@kafka-broker-3:9093"
  CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
  KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_MIN_INSYNC_REPLICAS: "2"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_LOG_RETENTION_HOURS: "168"

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: linktracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linktracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    image: migrate/migrate:v4.19.1
    profiles: [migrate]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://postgres:${POSTGRES_PASSWORD}@db:5432/linktracker?sslmode=disable"
      - "up"

  kafka-broker-1:
    <<: *kafka-common
    container_name: kafka-broker-1
    hostname: kafka-broker-1
    ports:
      - "19092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:19092,INTERNAL://kafka-broker-1:9094"
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka-broker-2:
    <<: *kafka-common
    container_name: kafka-broker-2
    hostname: kafka-broker-2
    ports:
      - "29092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "2"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:29092,INTERNAL://kafka-broker-2:9094"
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka-broker-3:
    <<: *kafka-common
    container_name: kafka-broker-3
    hostname: kafka-broker-3
    ports:
      - "39092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:39092,INTERNAL://kafka-broker-3:9094"
    volumes:
      - kafka3-data:/var/lib/kafka/data

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      kafka-broker-1:
        condition: service_healthy
      kafka-broker-2:
        condition: service_healthy
      kafka-broker-3:
        condition: service_healthy
    entrypoint: [ "bash", "-c" ]
    command:
      - |
        set -euo pipefail
        BOOTSTRAP="kafka-broker-1:9094,kafka-broker-2:9094,kafka-broker-3:9094"

        create_topic () {
          local name=$$1
          local partitions=$$2
          local rf=$$3
          shift 3
          kafka-topics --bootstrap-server "$$BOOTSTRAP" \
            --create --if-not-exists \
            --topic "$$name" \
            --partitions "$$partitions" \
            --replication-factor "$$rf" \
            "$$@"
        }

        create_topic link.raw-updates       3 3 \
          --config min.insync.replicas=2 \
          --config retention.ms=604800000

        create_topic link.processed-updates 3 3 \
          --config min.insync.replicas=2 \
          --config retention.ms=604800000

        create_topic failed-links           3 3 \
          --config min.insync.replicas=2 \
          --config retention.ms=604800000

        create_topic link.raw-updates-dlq   1 3 \
          --config min.insync.replicas=2 \
          --config retention.ms=2592000000

        create_topic link.processed-updates-dlq 1 3 \
          --config min.insync.replicas=2 \
          --config retention.ms=2592000000

        kafka-topics --bootstrap-server "$$BOOTSTRAP" --list

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka-broker-1:
        condition: service_healthy
      kafka-broker-2:
        condition: service_healthy
      kafka-broker-3:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "linktracker-local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka-broker-1:9094,kafka-broker-2:9094,kafka-broker-3:9094"
      KAFKA_CLUSTERS_0_SCHEMA_REGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: "true"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: schema-registry
    depends_on:
      kafka-broker-1:
        condition: service_healthy
      kafka-broker-2:
        condition: service_healthy
      kafka-broker-3:
        condition: service_healthy
    ports:
      - "18081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-broker-1:9094,PLAINTEXT://kafka-broker-2:9094,PLAINTEXT://kafka-broker-3:9094
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: "3"

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -ec
      - exec redis-server --appendonly no --save "" --requirepass "$$REDIS_PASSWORD"
    ports:
      - "6379:6379"
    healthcheck:
      test:
        ["CMD-SHELL", 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 5

  valkey-cluster:
    image: valkey/valkey:8-alpine
    container_name: valkey-cluster
    restart: unless-stopped
    ports:
      - "17000:17000"
      - "17001:17001"
      - "17002:17002"
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        AUTH=""
        if [ -n "$$VALKEY_PASSWORD" ]; then AUTH="--requirepass $$VALKEY_PASSWORD"; fi
        valkey-server --port 17000 --bind 0.0.0.0 --save "" --appendonly no \
          --cluster-enabled yes --cluster-config-file nodes-17000.conf $$AUTH &
        valkey-server --port 17001 --bind 0.0.0.0 --save "" --appendonly no \
          --cluster-enabled yes --cluster-config-file nodes-17001.conf $$AUTH &
        valkey-server --port 17002 --bind 0.0.0.0 --save "" --appendonly no \
          --cluster-enabled yes --cluster-config-file nodes-17002.conf $$AUTH &
        sleep 2
        CLI_AUTH=""
        if [ -n "$$VALKEY_PASSWORD" ]; then CLI_AUTH="-a $$VALKEY_PASSWORD"; fi
        while ! valkey-cli $$CLI_AUTH --cluster create 127.0.0.1:17000 127.0.0.1:17001 127.0.0.1:17002 --cluster-yes; do
          sleep 1
        done
        wait
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'CLI=""; [ -n "$$VALKEY_PASSWORD" ] && CLI="-a $$VALKEY_PASSWORD"; valkey-cli $$CLI -p 17000 cluster info | grep -q cluster_state:ok',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

volumes:
  pgdata:
  kafka1-data:
  kafka2-data:
  kafka3-data:
