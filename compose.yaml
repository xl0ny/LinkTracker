x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: linktracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linktracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    image: migrate/migrate:v4.19.1
    profiles: [migrate]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://postgres:${POSTGRES_PASSWORD:-app}@db:5432/linktracker?sslmode=disable"
      - "up"

  scrapper:
    profiles: [app]
    build: *app-build
    image: link-tracker:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_DB: linktracker
      POSTGRES_SSL_MODE: disable
      APP_BOT_URL: http://bot:8081
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "8080:8080"
    command: ["/app/scrapper"]

  bot:
    profiles: [app]
    build: *app-build
    image: link-tracker:dev
    depends_on:
      scrapper:
        condition: service_started
    environment:
      APP_TELEGRAM_TOKEN: ${APP_TELEGRAM_TOKEN:-}
      APP_SCRAPPER_URL: http://scrapper:8080
    ports:
      - "8081:8081"
    command: ["/app/bot"]

volumes:
  pgdata:
